<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <title>The Brave Digger</title>
</head>

<body>
    <div id="settings-panel">
        <h1>The Brave Digger</h1>
        <div class="setting-item">
            <label for="cemetery-width">Width</label>
            <input type="number" autocomplete="off" id="cemetery-width" min="3" max="51" step="2">
        </div>
        <div class="setting-item">
            <label for="cemetery-height">Height</label>
            <input type="number" autocomplete="off" id="cemetery-height" min="3" max="51" step="2">
        </div>
        <div class="setting-item">
            <label for="cemetery-gravestones">Gravestones</label>
            <input type="number" autocomplete="off" id="cemetery-gravestones">
        </div>
        <div class="setting-hint" id="gravestones-hint"></div>
        <div class="setting-item">
            <label for="cemetery-obstacles">Other obstacles</label>
            <input type="number" autocomplete="off" id="cemetery-obstacles" min="0">
        </div>
        <div class="setting-item">
            <label for="cemetery-time">Time allowance (sec)</label>
            <input type="number" autocomplete="off" id="cemetery-time" min="1">
        </div>
        <button id="restart-button">Restart (T)</button>
        <button id="regenerate-button">New layout (R)</button>
        <div id="capacity-warning"></div>
    </div>
    <div id="game-container">
        <div id="status-message"></div>
        <div id="timer">
            <div id="timer-bar"><div id="timer-fill"></div></div>
            <div id="timer-text"></div>
        </div>
        <div id="game-board"></div>
    </div>
</body>

</html>
